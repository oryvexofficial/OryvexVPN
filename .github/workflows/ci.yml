name: ci
# Fast checks on every push: core unit tests (exit directory, CLI, bridges) and script syntax.
on:
  push:
    branches: [main, master]
    paths-ignore: ["**.md", "docs/**", "branding/**", "site/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
jobs:
  core-tests:
    name: Core unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: oryvexcore
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: oryvexcore -> target
          key: ci-tests
      - uses: lukka/get-cmake@30aea713799f46b5b60e60f5fa83f849abd52c22 # latest
      - name: Unit tests
        run: cargo test --lib
      - name: Script syntax
        run: |
          for f in scripts/*.sh bypass/*.sh ../apps/android-src/tool/*.sh ../apps/desktop-src/tool/*.sh ../tools/*.sh; do bash -n "$f"; done
          python3 ../tools/tests/test_static_routes.py
          node ../tools/tests/test_cloudflare_worker.mjs
