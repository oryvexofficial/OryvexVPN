name: apps

# Builds every OryvexCore GUI package:
#
#   OryvexVPN-android-arm64-v8a.apk     modern phones (64-bit ARM)
#   OryvexVPN-android-armeabi-v7a.apk   older / low-end phones (32-bit ARM)
#   (No x86 Android package; Universal combines ARM64 and ARMv7)
#   OryvexVPN-android-universal.apk     all of the above in one file
#   OryvexVPN-Setup-<version>-x64.exe   Windows 10 / 11 installer
#
# Runs on its own for pull requests (artifacts on the run page), and is called by release.yml
# on a version tag (auto-release.yml makes one on every push to main).

on:
  # Pushes to main build through auto-release.yml -> release.yml, so they are not built twice here.
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.32.8"
  # Fox's gomobile binding requires Android 7.0 / API 24.
  ANDROID_API: "24"
  CARGO_TERM_COLOR: always

jobs:
  # ------------------------------------------------------------------
  # OryvexCore for each supported Android ABI, shipped as liboryvexcore_cli.so.
  # ------------------------------------------------------------------
  android-core:
    name: Android core (${{ matrix.abi }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            target: aarch64-linux-android
          - abi: armeabi-v7a
            target: armv7-linux-androideabi
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: oryvexcore -> target
          key: android-${{ matrix.abi }}

      - uses: lukka/get-cmake@30aea713799f46b5b60e60f5fa83f849abd52c22 # latest

      - name: Install Android NDK
        id: ndk
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        with:
          ndk-version: r28c

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - name: Build core
        id: build_core
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: bash apps/android-src/tool/build_android_natives.sh core ${{ matrix.abi }}

      # GitHub artifact uploads can fail transiently with ECONNRESET. Retry with
      # distinct names so a partially completed first attempt can't block a retry.
      - name: Upload Android core artifact (attempt 1)
        id: upload_core_artifact_1
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-android-core-${{ matrix.abi }}-attempt-1
          path: apps/android-src/android/app/src/main/jniLibs
          if-no-files-found: error

      - name: Upload Android core artifact (attempt 2)
        id: upload_core_artifact_2
        if: ${{ steps.upload_core_artifact_1.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-android-core-${{ matrix.abi }}-attempt-2
          path: apps/android-src/android/app/src/main/jniLibs
          if-no-files-found: error

      - name: Upload Android core artifact (attempt 3)
        id: upload_core_artifact_3
        if: ${{ steps.upload_core_artifact_2.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-android-core-${{ matrix.abi }}-attempt-3
          path: apps/android-src/android/app/src/main/jniLibs
          if-no-files-found: error

      - name: Verify Android core artifact upload
        if: ${{ always() && steps.build_core.outcome == 'success' }}
        env:
          UPLOAD_1: ${{ steps.upload_core_artifact_1.outcome }}
          UPLOAD_2: ${{ steps.upload_core_artifact_2.outcome }}
          UPLOAD_3: ${{ steps.upload_core_artifact_3.outcome }}
        run: |
          if [[ "$UPLOAD_1" != "success" && "$UPLOAD_2" != "success" && "$UPLOAD_3" != "success" ]]; then
            echo "::error::Android core artifact upload failed after three attempts."
            exit 1
          fi

  # ------------------------------------------------------------------
  # hev-socks5-tunnel (whole-device VPN mode) for every ABI, plus the
  # Java binding generated from the exact source that was compiled.
  # ------------------------------------------------------------------
  android-tun:
    name: Android VPN engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Android NDK
        id: ndk
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        with:
          ndk-version: r28c

      - name: Build hev-socks5-tunnel
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: bash apps/android-src/tool/build_android_natives.sh tun arm64-v8a armeabi-v7a

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-android-tun
          path: |
            apps/android-src/android/app/src/main/jniLibs
            apps/android-src/android/app/src/main/java/hev/htproxy/TProxyService.java
          if-no-files-found: error

  # ------------------------------------------------------------------
  # Flutter Android app: per-ABI APKs and one universal APK.
  # ------------------------------------------------------------------
  android-apk:
    name: Android APKs
    needs: [android-core, android-tun]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android-src
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Fetch core binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: native-android-core-*
          path: apps/android-src/android/app/src/main/jniLibs
          merge-multiple: true

      - name: Fetch VPN engine
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: native-android-tun
          path: apps/android-src/android/app/src/main

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: fox/core/go.mod
          cache-dependency-path: fox/core/go.sum

      - name: Install Android NDK for Fox core
        id: fox-ndk
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        with:
          ndk-version: r28c

      - name: Test Fox app-only API security
        working-directory: fox/core
        run: go test ./internal/service -run '^TestNativeClientHasNoWebPanel$' -count=1

      - name: Build Fox Android core binding
        working-directory: fox/core
        env:
          ANDROID_NDK_HOME: ${{ steps.fox-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.fox-ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          mkdir -p ../../apps/android-src/android/app/libs
          mobile_version="$(go list -m -f '{{.Version}}' golang.org/x/mobile)"
          go install "golang.org/x/mobile/cmd/gomobile@${mobile_version}"
          go install "golang.org/x/mobile/cmd/gobind@${mobile_version}"
          export PATH="$(go env GOPATH)/bin:$PATH"
          gomobile init
          gomobile bind -target=android/arm,android/arm64 -androidapi 24 -o ../../apps/android-src/android/app/libs/foxcore.aar ./mobile

      - name: Check native libraries
        run: |
          find android/app/src/main/jniLibs -type f -exec ls -l {} \;
          for abi in arm64-v8a armeabi-v7a; do
            test -f "android/app/src/main/jniLibs/$abi/liboryvexcore_cli.so" || { echo "missing core for $abi"; exit 1; }
            test -f "android/app/src/main/jniLibs/$abi/liboryvex_bypass.so" || { echo "missing bypass engine for $abi"; exit 1; }
            test -f "android/app/src/main/jniLibs/$abi/libhev-socks5-tunnel.so" || { echo "missing VPN tunnel engine for $abi"; exit 1; }
          done
          test -f android/app/src/main/java/hev/htproxy/TProxyService.java || { echo "missing hev-socks5-tunnel binding"; exit 1; }
          ls -l android/app/src/main/java/hev/htproxy/TProxyService.java

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            umask 077
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
            {
              echo "storeFile=release.jks"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > android/key.properties
            keytool -list -keystore android/app/release.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          elif [ "$REF_TYPE" = "tag" ]; then
            echo "::error::Tagged releases require all four ANDROID_KEYSTORE_* secrets."
            exit 1
          else
            echo "No private signing key configured; this non-release artifact uses the local debug key."
          fi

      - name: Bootstrap Flutter project
        run: bash tool/bootstrap.sh

      - name: Unit tests
        run: |
          node ../../tools/tests/test_fox_webchannel.js
          node ../../tools/tests/test_cloudflare_worker.mjs
          (cd ../shared && flutter pub get && flutter test)
          flutter test
          (cd android && ./gradlew :app:testDebugUnitTest)

      - name: Build APKs
        run: |
          flutter build apk --release --target-platform android-arm,android-arm64
          flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64

      - name: Collect APKs
        run: |
          mkdir -p ../../dist
          out=build/app/outputs/flutter-apk
          cp "$out/app-release.apk"             ../../dist/OryvexVPN-android-universal.apk
          cp "$out/app-arm64-v8a-release.apk"   ../../dist/OryvexVPN-android-arm64-v8a.apk
          cp "$out/app-armeabi-v7a-release.apk" ../../dist/OryvexVPN-android-armeabi-v7a.apk
          ls -l ../../dist

      - name: Verify APKs (signature, ABIs, minSdk)
        run: |
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          for f in ../../dist/*.apk; do
            echo "== $f"
            "$bt/apksigner" verify --verbose "$f" | grep -E "Verifies|v1 scheme|v2 scheme|v3 scheme"
            "$bt/aapt" dump badging "$f" | grep -E "^sdkVersion|native-code"
          done
          universal=../../dist/OryvexVPN-android-universal.apk
          for abi in arm64-v8a armeabi-v7a; do
            "$bt/aapt" dump badging "$universal" | grep '^native-code:' | grep -q "$abi" || { echo "universal APK has no $abi"; exit 1; }
            for lib in liboryvexcore_cli.so liboryvex_bypass.so libhev-socks5-tunnel.so; do
              unzip -l "$universal" "lib/$abi/$lib" | grep -q "lib/$abi/$lib" || { echo "universal APK is missing $abi/$lib"; exit 1; }
            done
          done
          "$bt/aapt" dump badging "$universal" | grep "^sdkVersion:'24'" || { echo "minSdk is not 24"; exit 1; }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: OryvexVPN-android-apks
          path: dist/*.apk
          if-no-files-found: error

  # ------------------------------------------------------------------
  # Windows x64 core with Tor transports and Psiphon, for the Flutter app.
  # ------------------------------------------------------------------
  windows-core:
    name: Windows core (x64)
    runs-on: windows-2022
    defaults:
      run:
        working-directory: oryvexcore
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: oryvexcore -> target
          key: windows-x64

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.22"
          # The Go tools are downloaded by the build scripts, not managed by a root go.mod.
          cache: false

      - uses: lukka/get-cmake@30aea713799f46b5b60e60f5fa83f849abd52c22 # latest

      - uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1

      - name: Build pluggable transports
        shell: bash
        run: bash scripts/pt-build.sh windows amd64 "$PWD/pt" "" "$PWD/LICENSES"

      - name: Build psiphon
        shell: bash
        run: bash scripts/psiphon-build.sh windows amd64 "$PWD/pt" "" "$PWD/LICENSES"

      - uses: mlugg/setup-zig@53fc45b17fe98b52f92ee5ea08ff48a85a3e7eb7 # v1
        with:
          version: 0.13.0

      - name: Build bypass engine
        shell: bash
        run: bash bypass/build.sh windows x86_64 "$PWD/bypass-out"

      - name: Build core
        shell: bash
        run: bash scripts/build-core.sh cargo build --release --target x86_64-pc-windows-msvc

      - name: Collect licenses
        shell: bash
        run: |
          cp ../LICENSE LICENSES/oryvexcore-LICENSE.txt
          python -m unittest discover -s scripts/tests -v
          python scripts/third-party-notices.py --target x86_64-pc-windows-msvc --features "${CORE_FEATURES_USED:-tor}" --output LICENSES/THIRD-PARTY-NOTICES.txt

      - name: Stage
        shell: bash
        run: |
          mkdir -p ../stage/core
          cp target/x86_64-pc-windows-msvc/release/oryvexcore.exe ../stage/core/
          cp bypass-out/oryvex-bypass.exe ../stage/core/
          cp -R pt LICENSES ../stage/core/

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-windows-core-x64
          path: stage/core
          if-no-files-found: error

  # ------------------------------------------------------------------
  # Fox is a separate Go service. Keep it beside the Oryvex core, with
  # its original GPL notices, under the non-upstream executable name.
  # ------------------------------------------------------------------
  fox-windows-core:
    name: Fox core (Windows x64)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: fox/core/go.mod
          cache-dependency-path: fox/core/go.sum

      - name: Build Fox core and stage its notices
        working-directory: fox/core
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ../../stage/core/LICENSES | Out-Null
          $line = (Get-Content ../../apps/desktop-src/pubspec.yaml | Where-Object { $_ -match '^version:' } | Select-Object -First 1)
          if ($line -notmatch '^version:\s*([0-9]+\.[0-9]+\.[0-9]+)') { throw "Cannot read app version" }
          $env:APP_VERSION = $Matches[1]
          go generate ./cmd/arman-vpn-core
          if ($LASTEXITCODE -ne 0) { throw "Fox Windows resources failed" }
          go build -trimpath -ldflags="-s -w" -o ../../stage/core/fox-core.exe ./cmd/arman-vpn-core
          if ($LASTEXITCODE -ne 0) { throw "Fox core build failed" }
          Copy-Item LICENSE ../../stage/core/LICENSES/fox-core-GPL-3.0.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-windows-fox-core
          path: stage/core
          if-no-files-found: error

  # ------------------------------------------------------------------
  # Flutter desktop app for Windows 10 / 11 x64, with the core bundled.
  # ------------------------------------------------------------------
  windows-app:
    name: Windows app (x64)
    needs: [windows-core, fox-windows-core]
    # windows-latest now ships only Visual Studio 2026, which Flutter older than 3.38.2 cannot
    # drive (CMake falls back to "Visual Studio 16 2019" and finds nothing). windows-2022 has
    # VS 2022. If GitHub retires that image, bump FLUTTER_VERSION to 3.38.2+ and use windows-latest.
    runs-on: windows-2022
    defaults:
      run:
        working-directory: apps/desktop-src
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Fetch core
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: native-windows-core-x64
          path: apps/desktop-src/core-bundle

      - name: Fetch Fox core
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: native-windows-fox-core
          path: apps/desktop-src/core-bundle

      - name: Set up NuGet for WebView2
        uses: NuGet/setup-nuget@d105a947828025cd7a980103c35ba2bfae586d0f # v2

      - name: Bootstrap Flutter project
        shell: pwsh
        run: ./tool/bootstrap.ps1

      - name: WebChannel fixture checks
        run: node ../../tools/tests/test_fox_webchannel.js

      - name: Shared Flutter tests
        shell: pwsh
        run: |
          Push-Location ../shared
          try { flutter pub get; if ($LASTEXITCODE -ne 0) { throw "pub get failed" }; flutter test; if ($LASTEXITCODE -ne 0) { throw "Flutter tests failed" } }
          finally { Pop-Location }

      - name: Build
        run: flutter build windows --release

      - name: Stage installer contents
        shell: pwsh
        run: |
          $rel = "build/windows/x64/runner/Release"
          if (-not (Test-Path "$rel/OryvexVPN.exe")) { Get-ChildItem $rel; throw "OryvexVPN.exe not found" }
          New-Item -ItemType Directory -Force "$rel/core" | Out-Null
          Copy-Item -Recurse -Force core-bundle/* "$rel/core/"
          # Flutter's engine links the MSVC runtime dynamically: ship it beside the exe so a
          # fresh Windows without the Visual C++ Redistributable still starts the app.
          foreach ($dll in "msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll") {
            Copy-Item -Force "$env:WINDIR/System32/$dll" "$rel/"
          }
          Copy-Item ../../LICENSE "$rel/LICENSE.txt"
          New-Item -ItemType Directory -Force ../../dist | Out-Null
          Get-ChildItem "$rel/core"

      - name: Sign first-party Windows executables
        shell: pwsh
        env:
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: ../../installer/windows/sign-release.ps1 -Stage payload -Path build/windows/x64/runner/Release

      - name: Build installer (NSIS)
        shell: pwsh
        run: |
          $nsis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Get-Command makensis.exe -ErrorAction SilentlyContinue) -and -not (Test-Path $nsis)) {
            choco install nsis -y --no-progress
          }
          ../../installer/windows/build-installer.ps1 -Source build/windows/x64/runner/Release -OutDir ../../dist
          Get-ChildItem ../../dist

      - name: Sign Windows installer
        shell: pwsh
        env:
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: ../../installer/windows/sign-release.ps1 -Stage installer -Path ../../dist

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: OryvexVPN-Setup-x64.exe
          path: dist/OryvexVPN-Setup-*-x64.exe
          if-no-files-found: error

